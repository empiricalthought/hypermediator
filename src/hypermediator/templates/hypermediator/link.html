<span class="hm-control" id="{{ bound.dom_id }}">{% if bound.state == "enabled" %}<a id="{{ bound.dom_id }}-c" href="{{ bound.url }}"{% if html_rel %} rel="{{ html_rel }}"{% endif %}{% for name, value in hx.items %} {{ name }}="{{ value }}"{% endfor %}>{{ label }}</a>{% else %}<a id="{{ bound.dom_id }}-c" role="link" aria-disabled="true" aria-describedby="{{ bound.dom_id }}-reason">{{ label }}</a><span id="{{ bound.dom_id }}-reason" class="hm-reason">{{ bound.reason }}</span>{% endif %}{% include "hypermediator/microdata.html" %}</span>
