<span class="hm-control" id="{{ bound.dom_id }}"><form id="{{ bound.dom_id }}-c" action="{{ bound.url }}" method="post"{% if html_rel %} rel="{{ html_rel }}"{% endif %}{% for name, value in hx.items %} {{ name }}="{{ value }}"{% endfor %}>{% csrf_token %}<button type="submit"{% if bound.state != "enabled" %} disabled aria-describedby="{{ bound.dom_id }}-reason"{% endif %}>{{ label }}</button></form>{% if bound.state != "enabled" %}<span id="{{ bound.dom_id }}-reason" class="hm-reason">{{ bound.reason }}</span>{% endif %}{% include "hypermediator/microdata.html" %}</span>
